<div class="join-form-wrapper">
    <form action="/joinTable" method="post" target="_self" class="join-form">
        <label for="username">Username: </label>
        <input type="text" name="username" id="username" onchange="updateData(this);" required>

        <label for="tableID">TableID: </label>
        <input type="text" name="tableID" id="tableID" onchange="updateData(this);" required>

        <label for="passcode">Passcode: </label>
        <input type="text" name="passcode" id="passcode" onchange="updateData(this);" required>

        <div class="form-btns-wrapper">
            <button type="button" class="form-btn cancel" fx-action="static/pages/home-menu.html" fx-method="get" fx-trigger="click" fx-target="#homeMenuWrapper" fx-swap="innerHTML">Cancel</button>
            <button type="submit" class="form-btn" onclick="saveData();">Join</button>
        </div>
    </form>
</div>
