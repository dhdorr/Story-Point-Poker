<div class="create-table-menu">
    <h2>Create Table</h2>
    <button fx-action="/home" fx-method="get" fx-trigger="click" fx-target="#home" fx-swap="outerHTML"> Cancel </button>
    <form action="/create-table" method="post">
        <input type="hidden" name="tableID" value="testID">
        <input type="hidden" name="passcode" value="testPC">
        <input type="hidden" name="username" value="testUN">
        <input type="hidden" name="cardLayout" value="fib">
        <input type="hidden" name="numCards" value="6">
        <input type="hidden" name="numRounds" value="2">
        <input type="hidden" name="roundTimeLimit" value="20">
        <input type="hidden" name="maxPlayers" value="2">

        <button type="submit"> Create </button>
    </form>
</div>
